name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Test signing policy
        run: python3 -m unittest discover -s Tests/SigningTests -v
      - name: Package local build
        env:
          ATLAS_SIGNING_MODE: ci
        run: ./scripts/build-app.sh release
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict "dist/Storage Atlas CI.app"
          plutil -lint Resources/Info.plist Resources/PrivacyInfo.xcprivacy
